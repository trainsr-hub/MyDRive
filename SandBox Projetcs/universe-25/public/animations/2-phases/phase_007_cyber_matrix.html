<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chrono Matrix · Cyber Voxel Defrag</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: transparent; font-family: 'Consolas', 'Courier New', monospace;
  color: #00f0ff; user-select: none;
}
canvas { position: fixed; inset: 0; display: block; }
.hud-layer {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  align-items: center; padding: 26px 20px 24px; z-index: 10;
}
.header { text-align: center; }
.sub-title { font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #00f0ff; opacity: .8; }
.main-title { font-size: 18px; font-weight: 800; letter-spacing: .12em; color: #e0faff; text-shadow: 0 0 16px rgba(0,240,255,0.6); }

.pool-vault {
  pointer-events: auto; display: flex; align-items: center; gap: 14px;
  background: rgba(2, 18, 30, 0.9); border: 1.5px solid #00f0ff;
  border-radius: 12px; padding: 12px 24px; margin-top: 8px;
  box-shadow: 0 0 24px rgba(0,240,255,0.3); transition: transform .1s ease, border-color .1s ease;
}
.pool-vault.absorb { transform: scale(1.05); border-color: #fff; box-shadow: 0 0 36px rgba(0,240,255,0.8); }
.vault-icon {
  width: 42px; height: 42px; border-radius: 8px; background: #002b47; border: 1.5px solid #00f0ff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: #00f0ff;
}
.vault-meta { display: flex; flex-direction: column; }
.vault-lbl { font-size: 9px; letter-spacing: .2em; color: #5eead4; text-transform: uppercase; }
.vault-val { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 12px rgba(0,240,255,0.7); }

/* Downward Smooth Sink Dissolve */
.burst-badge {
  position: absolute; top: calc(50% + 64px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; opacity: 0;
}
.burst-badge.spooling { opacity: 1; transform: translateX(-50%) scale(1); transition: opacity .12s ease; }
.burst-badge.slow-fade { animation: smoothSinkFade 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes smoothSinkFade {
  0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.05); filter: drop-shadow(0 0 20px rgba(0,240,255,0.9)); }
  100% { opacity: 0; transform: translateX(-50%) translateY(24px) scale(0.95); filter: drop-shadow(0 0 2px rgba(0,240,255,0)); }
}
.burst-lbl {
  font-size: 10px; font-family: inherit; letter-spacing: .25em; text-transform: uppercase;
  color: #00f0ff; font-weight: 800; text-shadow: 0 0 10px rgba(0,240,255,0.8);
}
.burst-val { font-size: 26px; font-weight: 900; color: #5eead4; letter-spacing: .08em; text-shadow: 0 0 18px rgba(94,234,212,0.8); }
.burst-val.lingering { font-size: 30px; color: #fff; text-shadow: 0 0 24px #00f0ff, 0 0 50px rgba(94,234,212,0.8); }

/* ── Integrated Controls (Golden Standard matching Image #3) ── */
.controls {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 460px;
  margin-bottom: 8px;
}

.variant-pill-row {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(14, 10, 24, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  margin-bottom: 8px;
}

.variant-pill {
  text-decoration: none;
  font-size: 11.5px;
  font-weight: 700;
  font-family: monospace;
  color: #8a7c9d;
  padding: 4px 10px;
  border-radius: 999px;
  transition: all 0.12s ease;
  display: flex;
  align-items: center;
  gap: 4px;
}

.variant-pill:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.variant-pill.active {
  color: #00f0ff;
  background: rgba(0, 240, 255, 0.15);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  border: 1px solid rgba(0, 240, 255, 0.4);
}

/* PRIMARY SUMMON BUTTON (Image #3) */
.chrono-summon-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 56px;
  border: 1px solid rgba(168, 85, 247, 0.6);
  border-radius: 14px;
  padding: 12px 32px;
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  background: linear-gradient(180deg, #371e68 0%, #5227a3 50%, #6830cc 100%);
  box-shadow: 0 8px 24px rgba(76, 29, 149, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, border-color 0.08s ease-out;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

.chrono-summon-button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(124, 58, 237, 0.6), 0 0 16px rgba(168, 85, 247, 0.4);
  border-color: #c084fc;
}

.chrono-summon-button:active:not(:disabled) {
  transform: translateY(0) scale(0.98);
}

.chrono-summon-button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.chrono-summon-button.is-spooling {
  background: linear-gradient(180deg, #2e1045 0%, #501777 50%, #7c2299 100%);
  border-color: #f0abfc;
  box-shadow: 0 8px 28px rgba(217, 70, 239, 0.45), 0 0 20px rgba(240, 171, 252, 0.5);
}

.btn-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.star-icon {
  font-size: 16px;
  filter: drop-shadow(0 0 6px #ffd86b);
}

/* WAGER BAR (Image #3) */
.chrono-wager-bar {
  width: 100%;
  padding: 8px 14px;
  border-radius: 12px;
  background: rgba(14, 10, 24, 0.95);
  border: 1px solid rgba(251, 191, 36, 0.35);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  user-select: none;
}

.chrono-wager-label {
  font-size: 11.5px;
  font-weight: 800;
  color: #ffd86b;
  font-family: monospace;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  white-space: nowrap;
}

.chrono-wager-select-wrapper {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
}

.chrono-wager-select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  padding: 6px 28px 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
  font-family: monospace;
  border: 1px solid rgba(251, 191, 36, 0.35);
  background: rgba(18, 12, 30, 0.95);
  color: #f5f0e8;
  cursor: pointer;
  outline: none;
  transition: all 0.12s ease-out;
}

.chrono-wager-select:hover {
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
}

.select-arrow {
  position: absolute;
  right: 10px;
  font-size: 9px;
  color: #ffd86b;
  pointer-events: none;
}

.ticket-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 8px;
  background: #120a1f;
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: #ffd86b;
  font-family: monospace;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s ease;
  white-space: nowrap;
}

.ticket-pill:hover {
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud-layer">
  <div class="header">
    <div class="variant-pill-row">
      <a href="javascript:void(0)" onclick="switchVariant('phase_005_spool_and_shatter.html')" class="variant-pill">⏳ Thermal</a>
      <a href="javascript:void(0)" onclick="switchVariant('phase_009_chronos_singularity.html')" class="variant-pill">⚛ Singularity</a>
      <a href="javascript:void(0)" onclick="switchVariant('phase_006_prismatic_crystal.html')" class="variant-pill">💎 Prism</a>
      <a href="javascript:void(0)" onclick="switchVariant('phase_007_cyber_matrix.html')" class="variant-pill active">💾 Cyber</a>
      <a href="javascript:void(0)" onclick="switchVariant('phase_010_supernova_spool.html')" class="variant-pill">☀️ Supernova</a>
    </div>

    <div class="pool-vault" id="poolVault">
      <div class="vault-icon">💾</div>
      <div class="vault-meta"><span class="vault-lbl">Accumulated Permanent Pool</span><span class="vault-val" id="poolVal">0s</span></div>
    </div>
  </div>

  <div class="burst-badge" id="burstBadge">
    <span class="burst-lbl" id="burstLabel">VOXEL BUFFER</span>
    <span class="burst-val" id="burstVal">0s</span>
  </div>

  <!-- ── Controls matching Image #3 with Variants ── -->
  <div class="controls">
    <button type="button" class="chrono-summon-button" id="summonBtn" onclick="handleSummonClick()">
      <span class="btn-content">
        <span class="star-icon">✨</span>
        <span id="btnText">Summon Chrono Duration (Gacha)</span>
      </span>
    </button>

    <div class="chrono-wager-bar">
      <span class="chrono-wager-label">ROLL WAGER:</span>
      <div class="chrono-wager-select-wrapper">
        <select id="wagerSelect" class="chrono-wager-select" onchange="handleWagerChange(this.value)">
          <option value="1">1x Ticket Wager (1 🎟️)</option>
          <option value="2">2x Ticket Wager (2 🎟️)</option>
          <option value="4">4x Ticket Wager (4 🎟️)</option>
          <option value="8">8x Ticket Wager (8 🎟️)</option>
          <option value="16">16x Ticket Wager (16 🎟️)</option>
        </select>
        <span class="select-arrow">▼</span>
      </div>
      <div class="ticket-pill" onclick="handleClaimTickets()" title="Click to claim +10 Free Tickets">
        <span>🎟️</span>
        <span id="ticketCount">15 Left</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const poolVaultEl = document.getElementById('poolVault'), poolValEl = document.getElementById('poolVal');
const burstBadgeEl = document.getElementById('burstBadge'), burstLabelEl = document.getElementById('burstLabel');
const burstValEl = document.getElementById('burstVal');

let W, H, cx, cy, targetX = 0, targetY = 0, permanentSec = 0, displayPermanentSec = 0;
let isSpooling = false, spoolSec = 0, targetSpoolSec = 0, spoolProgress = 0;
let screenShake = 0, bits = [], audioCtx = null, lingerTimeout = null;

function resize() {
  W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; cx = W / 2; cy = H / 2 - 20;
  const r = poolVaultEl.getBoundingClientRect(); targetX = r.left + r.width / 2; targetY = r.top + r.height / 2;
}
window.addEventListener('resize', resize);
resize();

function formatDuration(sec) {
  if (!sec || isNaN(sec) || sec < 0) return '0s';
  let s = Math.floor(sec);
  const Y = Math.floor(s / 31536000); s %= 31536000;
  const M = Math.floor(s / 2592000); s %= 2592000;
  const D = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); const rem = s % 60;
  const p = [];
  if (Y > 0) p.push(`${Y}Y`); if (M > 0) p.push(`${M}M`); if (D > 0) p.push(`${D}D`);
  if (h > 0) p.push(`${h}h`); if (m > 0) p.push(`${m}m`); if (rem > 0 || p.length === 0) p.push(`${rem}s`);
  return p.join('');
}

let userInteracted = false;
window.addEventListener('pointerdown', () => {
  userInteracted = true;
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch(e) {}
}, { passive: true });

function getAudioCtx() {
  if (!userInteracted) return null;
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    return (audioCtx && audioCtx.state === 'running') ? audioCtx : null;
  } catch(e) {
    return null;
  }
}

function playCyberChirp(freq) {
  try {
    const actx = getAudioCtx();
    if (!actx) return;
    const t = actx.currentTime, osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(freq, t); gain.gain.setValueAtTime(0.04, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03); osc.connect(gain); gain.connect(actx.destination);
    osc.start(t); osc.stop(t + 0.03);
  } catch(e) {}
}

function playDefragBoom() {
  try {
    const actx = getAudioCtx();
    if (!actx) return;
    const t = actx.currentTime, osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(240, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t + 0.4);
  } catch(e) {}
}

function depositSession(seconds) {
  isSpooling = true; targetSpoolSec = seconds; spoolSec = 0; spoolProgress = 0;
  clearTimeout(lingerTimeout);
  burstBadgeEl.className = 'burst-badge spooling'; burstValEl.className = 'burst-val';
  burstLabelEl.textContent = 'VOXEL BUFFER'; burstValEl.textContent = '0s';
}

function triggerShatter() {
  isSpooling = false; playDefragBoom();
  screenShake = Math.min(30, 8 + (targetSpoolSec / 3600) * 4);

  burstLabelEl.textContent = 'DEFRAG YIELD';
  burstValEl.textContent = formatDuration(targetSpoolSec);
  burstValEl.className = 'burst-val lingering';
  burstBadgeEl.className = 'burst-badge slow-fade';

  const btn = document.getElementById('summonBtn');
  const btnTxt = document.getElementById('btnText');
  if (btn) btn.classList.remove('is-spooling');
  if (btnTxt) {
    btnTxt.textContent = wager > 1
      ? 'Summon ' + wager + 'x Chrono Duration (Gacha)'
      : 'Summon Chrono Duration (Gacha)';
  }

  const pCount = Math.min(220, Math.max(45, Math.floor(targetSpoolSec / 80)));
  const secPerP = targetSpoolSec / pCount;
  for (let i = 0; i < pCount; i++) {
    const angle = Math.random() * Math.PI * 2, burstSpeed = 5 + Math.random() * 16;
    bits.push({
      x: cx, y: cy, vx: Math.cos(angle) * burstSpeed, vy: Math.sin(angle) * burstSpeed,
      secVal: secPerP, age: 0, magnetWait: 12 + Math.random() * 16,
      char: Math.random() > 0.5 ? '1' : '0'
    });
  }

  clearTimeout(lingerTimeout);
  lingerTimeout = setTimeout(() => { burstBadgeEl.className = 'burst-badge'; }, 1000);
}

function resetAll() {
  clearTimeout(lingerTimeout); isSpooling = false; permanentSec = 0; displayPermanentSec = 0;
  bits = []; screenShake = 0; poolValEl.textContent = '0s';
  burstBadgeEl.className = 'burst-badge'; burstValEl.className = 'burst-val';
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    screenShake *= 0.88; if (screenShake < 0.2) screenShake = 0;
  }
  ctx.fillStyle = 'rgba(12, 9, 20, 0.28)'; ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

  if (isSpooling) {
    spoolProgress += 0.045;
    spoolSec = Math.round(targetSpoolSec * Math.min(1.0, Math.pow(spoolProgress, 1.3)));
    burstValEl.textContent = formatDuration(spoolSec);
    screenShake = 1.0 + spoolProgress * 8;
    playCyberChirp(600 + spoolProgress * 800);

    const boxSize = 50 + spoolProgress * 40;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Date.now() * 0.002);
    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 18;
    ctx.strokeRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.fillRect(-boxSize / 2 + 6, boxSize / 2 - 6 - (boxSize - 12) * spoolProgress, boxSize - 12, (boxSize - 12) * spoolProgress);
    ctx.restore();

    if (spoolProgress >= 1.0) triggerShatter();
  } else {
    // Resting Isometric Voxel Box
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Date.now() * 0.001);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-25, -25, 50, 50); ctx.restore();
  }

  // Binary Bits Ingestion
  ctx.font = '12px Consolas, monospace';
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i]; p.age++;
    if (p.age < p.magnetWait) {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93;
    } else {
      const dx = targetX - p.x, dy = targetY - p.y, dist = Math.hypot(dx, dy);
      if (dist < 26) {
        permanentSec += p.secVal; poolVaultEl.classList.add('absorb');
        setTimeout(() => poolVaultEl.classList.remove('absorb'), 70);
        playCyberChirp(900 + (p.age % 10) * 80);
        bits.splice(i, 1); continue;
      }
      const pull = Math.min(26, 2.0 + (p.age - p.magnetWait) * 0.95);
      p.vx = (dx / dist) * pull; p.vy = (dy / dist) * pull; p.x += p.vx; p.y += p.vy;
    }
    ctx.fillStyle = '#5eead4'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
    ctx.fillText(p.char, p.x, p.y);
  }

  if (displayPermanentSec < permanentSec) {
    displayPermanentSec += Math.ceil((permanentSec - displayPermanentSec) * 0.2);
    poolValEl.textContent = formatDuration(displayPermanentSec);
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ── Gacha Mechanics & Image #3 Controller ──
const GACHA_WEIGHTS = [
  { tier: 'COMMON', weight: 60, min: 900, max: 2700, step: 300 },
  { tier: 'RARE', weight: 25, min: 3600, max: 10800, step: 900 },
  { tier: 'EPIC', weight: 10, min: 14400, max: 28800, step: 1800 },
  { tier: 'LEGENDARY', weight: 4, min: 43200, max: 86400, step: 3600 },
  { tier: 'MYTHIC', weight: 1, min: 172800, max: 432000, step: 14400 }
];

let tickets = parseInt(localStorage.getItem('chrono_tickets_v1') || '15');
let wager = 1;

function updateTicketDisplay() {
  const el = document.getElementById('ticketCount');
  if (el) el.textContent = tickets + ' Left';
  try { localStorage.setItem('chrono_tickets_v1', String(tickets)); } catch(e) {}
}

function handleClaimTickets() {
  tickets += 10;
  updateTicketDisplay();
}

function handleWagerChange(val) {
  wager = parseInt(val) || 1;
  const btnTxt = document.getElementById('btnText');
  if (btnTxt && !isSpooling) {
    btnTxt.textContent = wager > 1
      ? 'Summon ' + wager + 'x Chrono Duration (Gacha)'
      : 'Summon Chrono Duration (Gacha)';
  }
}

function switchVariant(targetHtml) {
  const currentBal = Math.max(permanentSec, displayPermanentSec);
  window.location.href = targetHtml + '?balance=' + currentBal;
}

function rollDuration() {
  let rand = Math.random() * 100;
  let chosen = GACHA_WEIGHTS[0];
  for (const t of GACHA_WEIGHTS) {
    if (rand < t.weight) { chosen = t; break; }
    rand -= t.weight;
  }
  const raw = chosen.min + Math.random() * (chosen.max - chosen.min);
  const stepped = Math.round(raw / chosen.step) * chosen.step;
  return Math.max(chosen.min, Math.min(chosen.max, stepped));
}

function handleSummonClick() {
  if (isSpooling) return;
  if (tickets < wager) {
    tickets += 10;
  }
  tickets = Math.max(0, tickets - wager);
  updateTicketDisplay();

  const baseSec = rollDuration();
  const totalSec = baseSec * wager;

  const btn = document.getElementById('summonBtn');
  const btnTxt = document.getElementById('btnText');
  if (btn) btn.classList.add('is-spooling');
  if (btnTxt) btnTxt.textContent = 'Spooling Chrono Kinetic Stream...';

  depositSession(totalSec);
}

// ── Universe 25 Parent PostMessage Bridge ──
(function initBridge() {
  updateTicketDisplay();
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('balance')) {
    permanentSec = parseFloat(urlParams.get('balance')) || 0;
    displayPermanentSec = permanentSec;
    if (poolValEl) poolValEl.textContent = formatDuration(permanentSec);
  }

  window.addEventListener('message', (event) => {
    if (!event.data) return;
    if (event.data.type === 'SET_BALANCE') {
      permanentSec = parseFloat(event.data.seconds) || 0;
      displayPermanentSec = permanentSec;
      if (poolValEl) poolValEl.textContent = formatDuration(permanentSec);
    } else if (event.data.type === 'TRIGGER_DEPOSIT') {
      depositSession(parseFloat(event.data.seconds) || 1800);
    } else if (event.data.type === 'RESET') {
      resetAll();
    }
  });

  const origDepositSession = depositSession;
  window.depositSession = function(seconds) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'DEPOSIT_STARTED', seconds: seconds }, '*');
    }
    origDepositSession(seconds);
  };

  const origTriggerShatter = triggerShatter;
  window.triggerShatter = function() {
    origTriggerShatter();
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'DEPOSIT_COMMITTED', seconds: targetSpoolSec }, '*');
    }
  };

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
  }
})();
</script>
